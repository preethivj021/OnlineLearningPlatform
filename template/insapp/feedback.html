<!DOCTYPE html>
{% extends 'insapp/base.html' %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    {% block b1 %}
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <form actio="" method="post">{%csrf_token%}
                    <h2>fill your feedback details</h2
                        <label for="">Enter your name</label>
                        <input type="text" name="name" class="form-control">
                        <label for="">Enter your rating</label>
                        <input type="number" name="rating" class="form-control">
                        <label for="">Enter your comment</label>
                        <input type="text" name="comment" class="form-control">
                        <input type="submit" value="submit">
                </form>
            </div>
        </div>
    </div>

    {% for f in fd%}
    name:{{f.name}}<br>
    rating:{{f.rating}}<br>
    comment:{{f.comment}}<br>
    created_at={{f.create_at}}<br>
    {{'------------------------------'}}<br>
    {% endfor %}
    {% endblock b1 %}
</body>
</html>
