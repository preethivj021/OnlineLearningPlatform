<!DOCTYPE html>
{% extends 'insapp/base.html' %} {% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body class="img">
    {% block b1 %}

    <h5 style="margin: 4% 0 0 2%">gallery page</h5>
    <div
      style="padding: 3%"
      class="img"
      style="overflow: hidden; display: inline-block"
    >
      <img
        src="{% static 'images/img1.png' %}"
        alt="my image"
        height="250"
        width="250"
        display="block"
      />
      <img
        style="padding-left: 3%"
        src="{% static 'images/img4.png' %}"
        alt="my image"
        height="290"
        display="block"
        width="280"
      />
      <img
        src="{% static 'images/img3.png' %}"
        alt="my image"
        height="250"
        display="block"
        width="250"
      />
      <img
        style="padding-left: 2%"
        src="{% static 'images/image5.jpg' %}"
        alt="my image"
        height="250"
        display="block"
        width="250"
      />
    </div>
    {% endblock b1 %}
  </body>
</html>
